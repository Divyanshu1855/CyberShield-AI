<!DOCTYPE html>
<html>
<head>
    <title>Login | CyberShield AI</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <h1>CyberShield <span>AI</span></h1>
        <h2>Welcome Back</h2>

        {% for message in get_flashed_messages() %}
            <p>{{ message }}</p>
        {% endfor %}

        <form method="POST">

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">Login</button>

        </form>

        <p>New user?
            <a href="{{ url_for('register') }}">Create Account</a>
        </p>

    </div>
</div>

</body>
</html>
